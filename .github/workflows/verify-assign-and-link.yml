name: Verify Assign and Link

on:
  workflow_dispatch:
    # Allow manual execution and cross-job re-triggering
    inputs:
      pr_number:
        description: "PR Number to force validate"
        required: false
        type: string
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
  issues:
    types:
      - assigned
      - unassigned
      - edited
    
permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write # Required so the runner can trigger workflow_dispatch loops

jobs:
  validate-pr:
    name: Validate PR
    if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -e
          
          # If triggered manually/dispatched without a PR input context, find the author dynamically
          if [ -z "$PR_AUTHOR" ]; then
            PR_AUTHOR=$(gh pr view "$PR_NUMBER" --json author --jq '.author.login')
          fi

          ISSUE_NUMBER=$(gh pr view "$PR_NUMBER" \
            --json closingIssuesReferences \
            --jq '.closingIssuesReferences[0].number // empty')

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "PR #$PR_NUMBER is not linked to an issue."

            gh pr edit "$PR_NUMBER" --add-label "Needs Issue"

            COMMENT_MARKER="<!-- verify-assign-and-link:Needs Issue -->"

            if ! gh pr view "$PR_NUMBER" \
              --json comments \
              --jq '.comments[].body' \
              | grep -Fq "$COMMENT_MARKER"; then

              gh pr comment "$PR_NUMBER" --body "$COMMENT_MARKER
          🇧🇷 **Português**
          Esta PR não está vinculada a uma issue. Por favor, vincule a issue que esta PR pretende resolver antes de continuar. Siga o
          [Guia do Contribuidor](https://readthedocs.io)
          para aprender como vincular uma issue à sua PR. As PRs devem estar associadas a uma issue antes do início da implementação.

          🇬🇧 **English**
          This PR is not linked to an issue. Please link the issue this PR is intended to resolve before continuing. Please follow
          the [Contributor Guide](https://readthedocs.io)
          to learn how to link an issue to a PR. PRs should be associated with an issue before implementation starts."
            fi

            exit 1
          fi

          echo "PR #$PR_NUMBER is linked to issue #$ISSUE_NUMBER."

          gh pr edit "$PR_NUMBER" \
            --remove-label "Needs Issue" 2>/dev/null || true

          ASSIGNEE=$(gh issue view "$ISSUE_NUMBER" \
            --json assignees \
            --jq '.assignees[0].login // empty')

          if [ -z "$ASSIGNEE" ]; then
            echo "Issue #$ISSUE_NUMBER has no assignee."

            gh pr edit "$PR_NUMBER" --add-label "Needs Assignment"

            COMMENT_MARKER="<!-- verify-assign-and-link:Needs Assignment:unassigned -->"

            if ! gh pr view "$PR_NUMBER" \
              --json comments \
              --jq '.comments[].body' \
              | grep -Fq "$COMMENT_MARKER"; then

              gh pr comment "$PR_NUMBER" --body "$COMMENT_MARKER
          🇧🇷 **Português**
          Esta issue ainda não está atribuída a ninguém. Por favor, atribua a issue a você antes de abrir uma PR.
          Siga o [Guia do Contribuidor](https://readthedocs.io)
          para aprender como reivindicar uma issue.
          Isso ajuda a evitar que várias pessoas trabalhem na mesma issue ao mesmo tempo.

          🇬🇧 **English**
          This issue is not assigned to anyone yet. Please assign the issue to yourself before opening a PR.
          Please follow the [Contributor Guide](https://readthedocs.io)
          to learn how to claim an issue.
          This helps us avoid multiple people working on the same issue at the same time."
            fi

            exit 1
          fi

          if [ "$ASSIGNEE" != "$PR_AUTHOR" ]; then
            echo "Issue #$ISSUE_NUMBER is assigned to $ASSIGNEE, not $PR_AUTHOR."

            gh pr edit "$PR_NUMBER" --add-label "Needs Assignment"

            COMMENT_MARKER="<!-- verify-assign-and-link:Needs Assignment:other -->"

            if ! gh pr view "$PR_NUMBER" \
              --json comments \
              --jq '.comments[].body' \
              | grep -Fq "$COMMENT_MARKER"; then

              gh pr comment "$PR_NUMBER" --body "$COMMENT_MARKER
          🇧🇷 **Português**
          Esta issue está atualmente atribuída a outra pessoa. Por favor, coordene com o responsável antes de abrir uma PR para esta issue.
          Se você pretende trabalhar nela, certifique-se de que a issue esteja atribuída a você primeiro.
          Veja o [Guia do Contribuidor](https://readthedocs.io)
          para mais informações.

          🇬🇧 **English**
          This issue is currently assigned to someone else.
          Please coordinate with the assignee before opening a PR for this issue.
          If you intend to work on it, please make sure the issue is assigned to you first.
          See the [Contributor Guide](https://readthedocs.io)
          for more information."
            fi

            exit 1
          fi

          echo "Issue #$ISSUE_NUMBER is correctly assigned to $PR_AUTHOR."

          gh pr edit "$PR_NUMBER" \
            --remove-label "Needs Assignment" 2>/dev/null || true


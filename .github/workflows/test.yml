name: Verify Issue Assignment

on:
  issues:
    types:
      - assigned
      - unassigned
      - edited

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate-issue:
    name: Validate Issue Assignment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Issue Assignment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
        run: |
          set -e

          echo "Event: $ACTION"
          echo "Issue: #$ISSUE_NUMBER"

          ASSIGNEE=$(gh issue view "$ISSUE_NUMBER" \
            --json assignees \
            --jq '.assignees[0].login // empty')

          echo "Assignee: $ASSIGNEE"

          if [ -z "$ASSIGNEE" ]; then
            echo "Issue #$ISSUE_NUMBER has no assignee."
            exit 1
          fi

          echo "Issue #$ISSUE_NUMBER is assigned to @$ASSIGNEE."

          gh issue comment "$ISSUE_NUMBER" \
            --body "ok"

name: Verify Issue Assignment

on:
  issues:
    types:
      - assigned
      - unassigned
      - edited

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate-issue:
    name: Validate Issue Assignment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Issue Assignment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -e

          echo "Event: $ACTION"
          echo "Issue: #$ISSUE_NUMBER"

          ASSIGNEE=$(gh issue view "$ISSUE_NUMBER" \
            --json assignees \
            --jq '.assignees[0].login // empty')

          echo "Assignee: ${ASSIGNEE:-none}"

          echo "Finding open PRs..."

          PR_NUMBERS=$(gh pr list \
            --repo "$REPOSITORY" \
            --state open \
            --json number \
            --jq '.[].number')

          if [ -z "$PR_NUMBERS" ]; then
            echo "No open PRs found."
            exit 0
          fi

          while IFS= read -r PR_NUMBER; do
            [ -z "$PR_NUMBER" ] && continue

            echo "Checking PR #$PR_NUMBER..."

            LINKED=$(gh pr view "$PR_NUMBER" \
              --repo "$REPOSITORY" \
              --json closingIssuesReferences \
              --jq --arg issue "$ISSUE_NUMBER" '
                [
                  .closingIssuesReferences[]
                  | select((.number | tostring) == $issue)
                ]
                | length
              ')

            if [ "$LINKED" -eq 0 ]; then
              continue
            fi

            echo "PR #$PR_NUMBER is linked to issue #$ISSUE_NUMBER."

            PR_AUTHOR=$(gh pr view "$PR_NUMBER" \
              --repo "$REPOSITORY" \
              --json author \
              --jq '.author.login')

            echo "PR author: @$PR_AUTHOR"

            if [ -z "$ASSIGNEE" ]; then
              echo "Issue #$ISSUE_NUMBER has no assignee."

              gh pr edit "$PR_NUMBER" \
                --repo "$REPOSITORY" \
                --add-label "Needs Assignment"

              continue
            fi

            if [ "$ASSIGNEE" != "$PR_AUTHOR" ]; then
              echo "Issue #$ISSUE_NUMBER is assigned to @$ASSIGNEE, not @$PR_AUTHOR."

              gh pr edit "$PR_NUMBER" \
                --repo "$REPOSITORY" \
                --add-label "Needs Assignment"

              continue
            fi

            echo "Issue #$ISSUE_NUMBER is correctly assigned to @$PR_AUTHOR."

            gh pr edit "$PR_NUMBER" \
              --repo "$REPOSITORY" \
              --remove-label "Needs Assignment" \
              2>/dev/null || true

          done <<< "$PR_NUMBERS"

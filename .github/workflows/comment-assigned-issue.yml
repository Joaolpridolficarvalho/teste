name: Comment on Issue Assignment

on:
  issues:
    types: [assigned, unassigned]

permissions:
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest

    steps:
         
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Comment "ok"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_NUMBER="${{ github.event.issue.number }}"

          if [ -z "${ISSUE_NUMBER:-}" ]; then
            echo "No issue number provided for this event; skipping issue comment."
            exit 0
          fi

          gh issue comment "$ISSUE_NUMBER" \
            --body "ok"
      - name: Call verify-assign-and-link workflow
        uses: ./.github/workflows/verify-assign-and-link.yml@main
